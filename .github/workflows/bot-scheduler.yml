# Every 30 minutes: starts the Zen Planner bots at the days and times set in the portal's
# Settings > Bots (automation/bot-scheduler.mjs). The bots themselves have no fixed schedule.
name: Bot scheduler

on:
  schedule:
    - cron: '5,35 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write # start the bot workflows

concurrency:
  group: bot-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the schedule rules
        run: node automation/bot-scheduler.check.mjs

      - name: Install Supabase client
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2

      - name: Start bots that are due
        env:
          # Public values (already in js/config.js).
          SUPABASE_URL: https://knnzybqudpdxhddcaxcv.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_fPh3JNTjI5Loc32jDzhJkw_i5YHeS9l
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node automation/bot-scheduler.mjs
