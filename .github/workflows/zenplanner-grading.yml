# Nightly, at the time set in the portal's Settings > Bots (started by bot-scheduler.yml): pulls Zen
# Planner's student programs grid (rank and attendance since the last test) into the Grading report.
# Also started by the Grading page's "Sync now" button (supabase/functions/run-pastdue-sync).
# GitHub only starts it once this file is on the default branch (production since 2026-10-21).
name: Zen Planner grading sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenplanner-grading
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the grading rules
        run: node automation/grading-core.check.mjs

      - name: Install browser and Supabase client
        run: |
          npm install --no-save --no-package-lock playwright@1 @supabase/supabase-js@2
          npx playwright install --with-deps chromium

      - name: Pull student programs and update the Grading report
        env:
          # Public values (already in js/config.js).
          SUPABASE_URL: https://knnzybqudpdxhddcaxcv.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_fPh3JNTjI5Loc32jDzhJkw_i5YHeS9l
          # Private: set under Settings > Secrets and variables > Actions.
          ZP_USERNAME: ${{ secrets.ZP_USERNAME }}
          ZP_PASSWORD: ${{ secrets.ZP_PASSWORD }}
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          TZ: Australia/Sydney
        run: node automation/zenplanner-grading.mjs

      # On failure, keep a screenshot of where Zen Planner stopped (visible screen only, kept 1 day).
      - name: Keep failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zenplanner-grading-failure
          path: automation-output/failure.png
          retention-days: 1
