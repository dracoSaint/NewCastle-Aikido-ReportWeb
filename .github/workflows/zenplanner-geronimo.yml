# Nightly, at the time set in the portal's Settings > Bots (started by bot-scheduler.yml): the Geronimo
# Metrics bot (automation/zenplanner-geronimo.mjs): week attendance and cancels, all members, trial waves, lock-in.
# Runs on the default branch (production).
name: Zen Planner Geronimo metrics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenplanner-geronimo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the Geronimo rules
        run: node automation/geronimo-core.check.mjs

      - name: Install browser and Supabase client
        run: |
          npm install --no-save --no-package-lock playwright@1 @supabase/supabase-js@2
          npx playwright install --with-deps chromium

      - name: Pull attendance, cancels and members; update waves and lock-in
        env:
          # Public values (already in js/config.js).
          SUPABASE_URL: https://knnzybqudpdxhddcaxcv.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_fPh3JNTjI5Loc32jDzhJkw_i5YHeS9l
          # Private: set under Settings > Secrets and variables > Actions.
          ZP_USERNAME: ${{ secrets.ZP_USERNAME }}
          ZP_PASSWORD: ${{ secrets.ZP_PASSWORD }}
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          TZ: Australia/Sydney
        run: node automation/zenplanner-geronimo.mjs

      # On failure, keep a screenshot of where Zen Planner stopped (visible screen only, kept 1 day).
      - name: Keep failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zenplanner-geronimo-failure
          path: automation-output/failure.png
          retention-days: 1
