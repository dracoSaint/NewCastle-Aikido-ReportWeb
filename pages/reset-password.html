<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Newcastle Aikido Portal</title>
  <link rel="stylesheet" href="../css/styles.css">
  <!-- Run authentication guard -->
  <script src="../js/auth.js"></script>
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-glass-card">
      <div class="login-header">
        <img class="login-logo animate-fade-in" src="../imgs/aikido-logo.png" alt="Newcastle Aikido Logo">
        <h1 class="login-title">Newcastle Aikido</h1>
        <p class="login-subtitle">Reset Password</p>
      </div>

      <!-- VIEW 1: Request Reset Link (Hidden by default, shown if no session) -->
      <div id="requestView" hidden>
        <form id="requestForm" class="login-form">
          <p class="reset-instruction-text">
            Enter the email address associated with your account, and we'll send you a link to reset your password.
          </p>

          <div id="requestErrorMessage" class="error-container" aria-live="assertive" hidden>
            <span class="error-icon">⚠️</span>
            <span id="requestErrorText" class="error-text"></span>
          </div>

          <div class="input-group">
            <input type="email" id="resetEmail" required placeholder=" " autocomplete="email">
            <label for="resetEmail">Email Address</label>
          </div>

          <button type="submit" id="requestSubmitBtn" class="login-btn">
            <span class="btn-text">Send Reset Link</span>
            <span class="spinner" hidden></span>
          </button>
        </form>
        <div class="form-footer reset-footer">
          <a href="login.html" class="forgot-link">← Back to Sign In</a>
        </div>
      </div>

      <!-- VIEW 2: Update Password Form (Hidden by default, shown if session is active) -->
      <div id="updateView" hidden>
        <form id="updateForm" class="login-form">
          <p class="reset-instruction-text">
            Please enter your new password below to secure your account.
          </p>

          <div id="updateErrorMessage" class="error-container" aria-live="assertive" hidden>
            <span class="error-icon">⚠️</span>
            <span id="updateErrorText" class="error-text"></span>
          </div>

          <div class="input-group">
            <input type="password" id="newPassword" required placeholder=" " autocomplete="new-password">
            <label for="newPassword">New Password</label>
          </div>

          <div class="input-group">
            <input type="password" id="confirmPassword" required placeholder=" " autocomplete="new-password">
            <label for="confirmPassword">Confirm Password</label>
          </div>

          <button type="submit" id="updateSubmitBtn" class="login-btn">
            <span class="btn-text">Update Password</span>
            <span class="spinner" hidden></span>
          </button>
        </form>
      </div>

      <!-- VIEW 3: Success Feedback (Hidden by default) -->
      <div id="successView" class="success-view-container" hidden>
        <div class="success-icon-wrap">
          <span class="success-icon">✓</span>
        </div>
        <h2 id="successTitle" class="success-title">Link Sent!</h2>
        <p id="successMessage" class="success-text"></p>
        <div id="successAction" class="success-action-wrap">
          <a href="login.html" class="login-btn success-btn">Return to Sign In</a>
        </div>
      </div>
    </div>
  </div>

<script src="../js/siteHeader.js"></script>
<script src="../js/reset-password.js"></script>
</body>
</html>
