<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newcastle Aikido - Grading Report</title>
<link rel="stylesheet" href="../../css/styles.css">
<script src="../../js/auth.js"></script>
</head>

<body>

<header>
  <p id="updatedLine">Loading...</p>
  <button id="openSpreadsheet" onclick="window.open('https://docs.google.com/spreadsheets/d/1EmS3-3mxova9vQSavu-bYR05sGyve-q5CE2Xq12FLis/edit?gid=680756908#gid=680756908', '_blank')">Open Spreadsheet</button>
  <nav class="site-nav">
    <button data-tab="home" class="active">Overview</button>
    <button data-tab="adults">Regular Adult Grading</button>
    <button data-tab="juniors">Juniors Grading</button>
    <button data-tab="members">Member List</button>
  </nav>
</header>

<main>

  <div class="member-toolbar grading-toolbar">
    <label class="member-search">
      <span class="sr-only">Search members by name</span>
      <input type="search" id="filterInput" placeholder="Search by name" autocomplete="off">
    </label>
  </div>

  <section class="tab-panel active" id="tab-home">
    <div class="past-due-metrics key-strip" id="gradingKeyFigure" aria-live="polite"></div>
    <div class="groups two-col">
      <div class="card">
        <h2>Regular Adults</h2>
        <div class="table-wrap" id="home-adults-wrap"><div class="loading">Loading...</div></div>
      </div>
      <div class="card">
        <h2>Juniors</h2>
        <div class="table-wrap" id="home-juniors-wrap"><div class="loading">Loading...</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Close to eligible</h2>
      <p class="page-lede">Within 3 hours of the hours needed, closest first.</p>
      <div class="table-wrap" id="home-close-wrap"><div class="loading">Loading...</div></div>
    </div>
  </section>

  <section class="tab-panel" id="tab-adults">
    <div class="card">
      <h2>Regular Adult Grading</h2>
      <div class="table-wrap" id="adults-wrap"><div class="loading">Loading...</div></div>
    </div>
  </section>

  <section class="tab-panel" id="tab-juniors">
    <div class="card">
      <h2>Juniors Grading</h2>
      <div class="table-wrap" id="juniors-wrap"><div class="loading">Loading...</div></div>
    </div>
  </section>

  <section class="tab-panel" id="tab-members">
    <div class="card">
      <h2>Member List</h2>
      <div class="table-wrap" id="members-wrap"><div class="loading">Loading...</div></div>
    </div>
  </section>

</main>

<footer></footer>

<script src="../../js/siteHeader.js"></script>
<script src="../../js/siteMenu.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/gradingScripts.js"></script>
</body>

<script src="../../js/footer.js"></script>
</html>
