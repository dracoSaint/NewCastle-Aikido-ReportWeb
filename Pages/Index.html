<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Google Sheets Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4361ee;
            --background: #f4f7fe;
            --card-bg: #ffffff;
            --text-main: #2b3674;
            --text-muted: #a3aed1;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e5f2;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin: 5px 0 0 0;
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            text-align: center;
        }

        .kpi-card h3 {
            margin: 0;
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .kpi-card .value {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0 0 0;
            color: var(--primary);
        }

        /* Chart and Data Section */
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .panel h2 {
            margin-top: 0;
            font-size: 18px;
            margin-bottom: 20px;
        }

        /* Simple Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e5f2;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        .status-loading {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>Business Dashboard</h1>
            <p class="subtitle">Data pulled directly from Google Sheets</p>
        </header>

        <div class="kpi-grid">
            <div class="kpi-card">
                <h3>Total Revenue</h3>
                <p class="value" id="kpi-revenue">...</p>
            </div>
            <div class="kpi-card">
                <h3>Active Users</h3>
                <p class="value" id="kpi-users">...</p>
            </div>
            <div class="kpi-card">
                <h3>New Signups</h3>
                <p class="value" id="kpi-signups">...</p>
            </div>
        </div>

        <div class="content-grid">
            <div class="panel">
                <h2>Revenue Overview</h2>
                <canvas id="myChart"></canvas>
            </div>

            <div class="panel">
                <h2>Recent Activity</h2>
                <div id="table-container">
                    <p class="status-loading">Loading data from Sheets...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. SETUP YOUR GOOGLE SHEET
        // ==========================================
        // Go to your Google Sheet -> File -> Share -> Publish to web
        // Select "Entire Document" or a specific sheet, and choose "Comma-separated values (.csv)"
        // Paste that URL below:
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSkqx73tOY6slJxQOCq1dN_D6ElQl1BQBxbZI-Fu_PebmfB2jTYNvLSP812xJsqD8R6DOiE_9P_mDuk/pub?output=csv';

        // ==========================================
        // 2. FETCH & PROCESS DATA
        // ==========================================
        async function fetchSheetData() {
            try {
                // If you haven't put a real URL in yet, we will load dummy data
                if (SHEET_CSV_URL === 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSkqx73tOY6slJxQOCq1dN_D6ElQl1BQBxbZI-Fu_PebmfB2jTYNvLSP812xJsqD8R6DOiE_9P_mDuk/pub?output=csv') {
                    loadDummyData();
                    return;
                }

                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                
                // Parse CSV (Basic implementation - for complex CSVs, consider using a library like PapaParse)
                const rows = data.split('\n').map(row => row.split(','));
                
                // Assuming first row is headers: ["Date", "Revenue", "Users", "Signups"]
                const headers = rows[0];
                const dataRows = rows.slice(1);

                updateDashboard(headers, dataRows);

            } catch (error) {
                console.error('Error fetching Google Sheets data:', error);
                document.getElementById('table-container').innerHTML = '<p style="color:red;">Error loading data.</p>';
            }
        }

        // ==========================================
        // 3. UPDATE THE DASHBOARD UI
        // ==========================================
        function updateDashboard(headers, dataRows) {
            // -- Update KPIs (Example: getting the last row's data) --
            const latestData = dataRows[dataRows.length - 1];
            document.getElementById('kpi-revenue').innerText = '$' + latestData[1];
            document.getElementById('kpi-users').innerText = latestData[2];
            document.getElementById('kpi-signups').innerText = latestData[3];

            // -- Draw Chart --
            const labels = dataRows.map(row => row[0]); // Dates
            const revenueData = dataRows.map(row => parseFloat(row[1])); // Revenue

            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Revenue',
                        data: revenueData,
                        borderColor: '#4361ee',
                        backgroundColor: 'rgba(67, 97, 238, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    }
                }
            });

            // -- Populate Table --
            let tableHTML = '<table><tr>';
            headers.forEach(header => tableHTML += `<th>${header}</th>`);
            tableHTML += '</tr>';

            // Show last 5 rows in the table
            const recentRows = dataRows.slice(-5).reverse();
            recentRows.forEach(row => {
                tableHTML += '<tr>';
                row.forEach(cell => tableHTML += `<td>${cell}</td>`);
                tableHTML += '</tr>';
            });
            tableHTML += '</table>';
            
            document.getElementById('table-container').innerHTML = tableHTML;
        }

        // ==========================================
        // DUMMY DATA FALLBACK FOR PREVIEWING
        // ==========================================
        function loadDummyData() {
            const dummyHeaders = ["Date", "Revenue", "Users", "Signups"];
            const dummyRows = [
                ["Mon", "1200", "450", "12"],
                ["Tue", "1900", "480", "15"],
                ["Wed", "3000", "520", "28"],
                ["Thu", "5000", "590", "45"],
                ["Fri", "8240", "650", "64"]
            ];
            updateDashboard(dummyHeaders, dummyRows);
        }

        // Initialize dashboard
        fetchSheetData();
    </script>
</body>
</html>
