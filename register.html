<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Registration - Newcastle Aikido Portal</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/auth.js"></script>
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-glass-card">
      <div class="login-header">
        <img class="login-logo animate-fade-in" src="imgs/aikido-logo.png" alt="Newcastle Aikido Logo">
        <h1 class="login-title">Complete Registration</h1>
        <p class="login-subtitle">Set up your Studio Operations Portal account</p>
      </div>

      <form id="registerForm" class="login-form">
        <div id="errorMessage" class="error-container" aria-live="assertive" hidden>
          <span class="error-icon">!</span>
          <span id="errorText" class="error-text"></span>
        </div>

        <div class="input-group">
          <input type="text" id="fullName" required placeholder=" " autocomplete="name">
          <label for="fullName">Full Name</label>
        </div>

        <div class="input-group">
          <input type="password" id="password" required placeholder=" " autocomplete="new-password" minlength="8">
          <label for="password">Password</label>
        </div>

        <div class="input-group">
          <input type="password" id="confirmPassword" required placeholder=" " autocomplete="new-password" minlength="8">
          <label for="confirmPassword">Confirm Password</label>
        </div>

        <button type="submit" id="submitBtn" class="login-btn">
          <span class="btn-text">Create Account</span>
          <span class="spinner" hidden></span>
        </button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const errorContainer = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = submitBtn.querySelector('.btn-text');
    const spinner = submitBtn.querySelector('.spinner');

    function showError(message) {
      errorText.textContent = message;
      errorContainer.hidden = false;
    }

    async function waitForInviteSession() {
      if (!window.supabaseClient) {
        setTimeout(waitForInviteSession, 50);
        return;
      }

      const { data: { session } } = await window.supabaseClient.auth.getSession();
      if (!session) showError('This invitation link is invalid or has expired. Please request a new invitation.');
    }

    waitForInviteSession().catch(error => showError(error.message));

    form.addEventListener('submit', async event => {
      event.preventDefault();
      errorContainer.hidden = true;

      const fullName = document.getElementById('fullName').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password.length < 8) return showError('Password must be at least 8 characters.');
      if (password !== confirmPassword) return showError('Passwords do not match.');

      submitBtn.disabled = true;
      btnText.textContent = 'Creating Account...';
      spinner.hidden = false;

      try {
        const { data: { session } } = await window.supabaseClient.auth.getSession();
        if (!session) throw new Error('This invitation link is invalid or has expired. Please request a new invitation.');

        const { error } = await window.supabaseClient.auth.updateUser({
          password,
          data: { full_name: fullName }
        });
        if (error) throw error;

        window.location.replace('index.html');
      } catch (error) {
        showError(error.message || 'Unable to complete registration.');
        submitBtn.disabled = false;
        btnText.textContent = 'Create Account';
        spinner.hidden = true;
      }
    });
  </script>
</body>
</html>
