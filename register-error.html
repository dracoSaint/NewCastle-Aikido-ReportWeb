<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Invite Required - Newcastle Aikido Portal</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-glass-card">
      <div class="login-header">
        <img class="login-logo animate-fade-in" src="imgs/aikido-logo.png" alt="Newcastle Aikido Logo">
        <h1 class="login-title">Invitation Required</h1>
        <p class="login-subtitle">This registration page can only be accessed through a valid invitation link.</p>
      </div>

      <div class="error-container" role="alert">
        <span class="error-icon">!</span>
        <span class="error-text">Please use the invitation email sent to you, or ask an administrator to send a new invitation.</span>
      </div>

      <a href="login.html" class="login-btn">Return to Sign In</a>
    </div>
  </div>
</body>
</html>
