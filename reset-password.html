<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Newcastle Aikido Portal</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Run authentication guard -->
  <script src="js/auth.js"></script>
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-glass-card">
      <div class="login-header">
        <img class="login-logo animate-fade-in" src="imgs/aikido-logo.png" alt="Newcastle Aikido Logo">
        <h1 class="login-title">Newcastle Aikido</h1>
        <p class="login-subtitle">Reset Password</p>
      </div>

      <!-- VIEW 1: Request Reset Link (Hidden by default, shown if no session) -->
      <div id="requestView" hidden>
        <form id="requestForm" class="login-form">
          <p class="reset-instruction-text">
            Enter the email address associated with your account, and we'll send you a link to reset your password.
          </p>

          <div id="requestErrorMessage" class="error-container" aria-live="assertive" hidden>
            <span class="error-icon">⚠️</span>
            <span id="requestErrorText" class="error-text"></span>
          </div>

          <div class="input-group">
            <input type="email" id="resetEmail" required placeholder=" " autocomplete="email">
            <label for="resetEmail">Email Address</label>
          </div>

          <button type="submit" id="requestSubmitBtn" class="login-btn">
            <span class="btn-text">Send Reset Link</span>
            <span class="spinner" hidden></span>
          </button>
        </form>
        <div class="form-footer reset-footer">
          <a href="login.html" class="forgot-link">← Back to Sign In</a>
        </div>
      </div>

      <!-- VIEW 2: Update Password Form (Hidden by default, shown if session is active) -->
      <div id="updateView" hidden>
        <form id="updateForm" class="login-form">
          <p class="reset-instruction-text">
            Please enter your new password below to secure your account.
          </p>

          <div id="updateErrorMessage" class="error-container" aria-live="assertive" hidden>
            <span class="error-icon">⚠️</span>
            <span id="updateErrorText" class="error-text"></span>
          </div>

          <div class="input-group">
            <input type="password" id="newPassword" required placeholder=" " autocomplete="new-password">
            <label for="newPassword">New Password</label>
          </div>

          <div class="input-group">
            <input type="password" id="confirmPassword" required placeholder=" " autocomplete="new-password">
            <label for="confirmPassword">Confirm Password</label>
          </div>

          <button type="submit" id="updateSubmitBtn" class="login-btn">
            <span class="btn-text">Update Password</span>
            <span class="spinner" hidden></span>
          </button>
        </form>
      </div>

      <!-- VIEW 3: Success Feedback (Hidden by default) -->
      <div id="successView" class="success-view-container" hidden>
        <div class="success-icon-wrap">
          <span class="success-icon">✓</span>
        </div>
        <h2 id="successTitle" class="success-title">Link Sent!</h2>
        <p id="successMessage" class="success-text"></p>
        <div id="successAction" class="success-action-wrap">
          <a href="login.html" class="login-btn success-btn">Return to Sign In</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Initialize UI views based on session state
    async function initViews() {
      if (!window.supabaseClient) {
        // Wait for auth.js to load Supabase
        setTimeout(initViews, 50);
        return;
      }

      try {
        const { data: { session } } = await window.supabaseClient.auth.getSession();
        
        const requestView = document.getElementById('requestView');
        const updateView = document.getElementById('updateView');

        if (session) {
          // If session is present (user clicked emailed recovery link), show Update View
          requestView.hidden = true;
          updateView.hidden = false;
        } else {
          // If no session is present, show Request View
          requestView.hidden = false;
          updateView.hidden = true;
        }
      } catch (err) {
        console.error('Session retrieval error on reset page:', err);
        document.getElementById('requestView').hidden = false;
      }
    }

    // Cooldown state
    let cooldownTimer = null;
    let cooldownSeconds = 0;
    const COOLDOWN_DURATION = 60; // seconds

    function startCooldown(submitBtn, btnText, spinner) {
      cooldownSeconds = COOLDOWN_DURATION;
      submitBtn.disabled = true;
      spinner.hidden = true;

      cooldownTimer = setInterval(() => {
        cooldownSeconds--;
        btnText.textContent = `Resend in ${cooldownSeconds}s`;
        if (cooldownSeconds <= 0) {
          clearInterval(cooldownTimer);
          cooldownTimer = null;
          submitBtn.disabled = false;
          btnText.textContent = 'Send Reset Link';
        }
      }, 1000);
    }

    // Bind forms
    document.getElementById('requestForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Block if cooldown is active
      if (cooldownTimer) return;

      const email = document.getElementById('resetEmail').value.trim();
      const submitBtn = document.getElementById('requestSubmitBtn');
      const btnText = submitBtn.querySelector('.btn-text');
      const spinner = submitBtn.querySelector('.spinner');

      document.getElementById('requestErrorMessage').hidden = true;
      if (!email) {
        showError('request', 'Please enter your email address.');
        return;
      }

      // Show loader
      submitBtn.disabled = true;
      btnText.textContent = 'Sending...';
      spinner.hidden = false;

      try {
        const resetPageUrl = window.location.href.split('?')[0].split('#')[0];

        const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: resetPageUrl
        });

        if (error) throw error;

        // Show success screen
        document.getElementById('requestView').hidden = true;

        document.getElementById('successTitle').textContent = 'Link Sent!';
        document.getElementById('successMessage').textContent =
          `We've sent a password recovery link to ${email}. Please check your inbox and spam folder.`;
        document.getElementById('successView').hidden = false;

      } catch (err) {
        console.error('Reset request error:', err);

        // Friendly rate-limit message
        const isRateLimit = err.message && (
          err.message.toLowerCase().includes('rate limit') ||
          err.message.toLowerCase().includes('email rate limit') ||
          err.message.toLowerCase().includes('too many')
        );

        const friendlyMsg = isRateLimit
          ? 'Too many reset requests. Please wait a minute before trying again.'
          : (err.message || 'Failed to send reset link. Please try again.');

        showError('request', friendlyMsg);

        // Always start cooldown after a failed attempt to avoid hammering the API
        startCooldown(submitBtn, btnText, spinner);
      }
    });


    document.getElementById('updateForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorContainer = document.getElementById('updateErrorMessage');
      const errorText = document.getElementById('updateErrorText');
      const submitBtn = document.getElementById('updateSubmitBtn');
      const btnText = submitBtn.querySelector('.btn-text');
      const spinner = submitBtn.querySelector('.spinner');

      errorContainer.hidden = true;
      if (!newPassword || !confirmPassword) {
        showError('update', 'Please fill in all fields.');
        return;
      }

      // Enforce password strength rules
      if (newPassword.length < 8) {
        showError('update', 'Password must be at least 8 characters long.');
        return;
      }

      if (!/[A-Z]/.test(newPassword)) {
        showError('update', 'Password must contain at least one uppercase letter (A–Z).');
        return;
      }

      if (!/[^A-Za-z0-9]/.test(newPassword)) {
        showError('update', 'Password must contain at least one special character (e.g. !@#$%^&*).');
        return;
      }

      if (newPassword !== confirmPassword) {
        showError('update', 'Passwords do not match.');
        return;
      }

      // Show loader
      submitBtn.disabled = true;
      btnText.textContent = 'Updating...';
      spinner.hidden = false;

      try {
        const { error } = await window.supabaseClient.auth.updateUser({
          password: newPassword
        });

        if (error) throw error;

        // Show success and redirect
        document.getElementById('updateView').hidden = true;

        const successView = document.getElementById('successView');
        document.getElementById('successTitle').textContent = 'Password Updated!';
        document.getElementById('successMessage').textContent = 
          'Your password has been successfully updated. You are now logged in and redirecting to the portal...';
        
        // Hide the sign-in button since we redirect automatically
        document.getElementById('successAction').hidden = true;
        successView.hidden = false;

        // Redirect to index after 3 seconds
        const currentUrlClean = window.location.href.split('?')[0].split('#')[0];
        const homeUrl = currentUrlClean.substring(0, currentUrlClean.lastIndexOf('/')) + '/index.html';
        setTimeout(() => {
          window.location.replace(homeUrl);
        }, 3000);

      } catch (err) {
        console.error('Password update error:', err);
        showError('update', err.message || 'Failed to update password. Please try again.');
        submitBtn.disabled = false;
        btnText.textContent = 'Update Password';
        spinner.hidden = true;
      }
    });

    function showError(formType, message) {
      const errorContainer = document.getElementById(formType + 'ErrorMessage');
      const errorText = document.getElementById(formType + 'ErrorText');
      errorText.textContent = message;
      errorContainer.hidden = false;
      errorContainer.classList.add('shake');
      setTimeout(() => errorContainer.classList.remove('shake'), 500);
    }

    // Start checking views
    initViews();
  </script>
</body>
</html>
